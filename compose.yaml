services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    profiles: [oidc]
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: demo-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-admin-change-me}
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - keycloak_demo_data:/opt/keycloak/data
      - ./dev/keycloak/sujus-pickle-realm.json:/opt/keycloak/data/import/sujus-pickle-realm.json:ro

  postgres:
    image: postgres:17-alpine
    container_name: pickle-store-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: pickle_store
      POSTGRES_USER: pickle_user
      POSTGRES_PASSWORD: pickle_password

    ports:
      - "15432:5432"

    volumes:
      - pickle_store_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickle_user -d pickle_store"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  keycloak_demo_data:
  pickle_store_postgres_data:
