spring:
  application:
    name: pickle-store-backend

  datasource:
    url: jdbc:postgresql://127.0.0.1:55432/pickle_store
    username: pickle_user
    password: pickle_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG